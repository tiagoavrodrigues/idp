services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: angular-app
    ports:
      - "${APP_PORT}:80"
    depends_on:
      api:
        condition: service_started
    environment:
      API_URL: ${API_URL}
    restart: unless-stopped

  api:
    image: node:20-alpine
    container_name: mock-api
    working_dir: /data
    command: >
      sh -c "npm install -g json-server &&
             json-server --watch --host 0.0.0.0 --port 3000 db.json"
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./mock-api:/data
    environment:
      JSON_SERVER_WATCH: ${JSON_SERVER_WATCH}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://api:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
